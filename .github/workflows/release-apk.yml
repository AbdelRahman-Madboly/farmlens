name: Release APK

# Push a tag like v0.2.0 (or run this by hand from the Actions tab) to build
# the Android app and attach farmlens.apk to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update, e.g. v0.2.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.4"
          cache: true
      - name: Install
        run: flutter pub get
      - name: Test
        run: flutter test
      - name: Build APK
        run: flutter build apk --release
      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/farmlens.apk"
      - name: Publish release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Android app for the FarmLens node. On the phone: download farmlens.apk, open it and allow installing from this source. See the README for the full setup."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" farmlens.apk --clobber
          else
            gh release create "$TAG" farmlens.apk --title "FarmLens $TAG" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
