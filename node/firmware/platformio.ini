; FarmLens firmware: ESP32 sensor bridge
; Build:       pio run -e esp32dev
; Unit tests:  pio test -e native   (host machine, no board needed)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7

[env:native]
platform       = native
test_framework = unity
build_flags    = -std=c++17
